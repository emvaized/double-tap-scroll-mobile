<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Double Tap Scroll - Settings</title>
    <link rel="stylesheet" href="options.css" />
</head>
<body>
    <main>
        <h1>Settings</h1>

        <section class="setting">
            <label for="scrollVelocityMultiplier">
                <span class="label-title">Scroll speed</span>
                <span class="note">Higher values make scrolling faster. Default: 1.0</span>
            </label>
            <input type="number" id="scrollVelocityMultiplier" min="0.1" max="5" step="0.1" value="1">
        </section>

        <section class="setting">
            <label for="doubleTapTimeout">
                <span class="label-title">Double tap timeout</span>
                <span class="note">Max timeout between taps to register. Default: 200ms</span>
            </label>
            <input type="number" id="doubleTapTimeout" min="0" max="5000" step="50" value="200">
        </section>

        <section class="setting">
            <input type="checkbox" id="continueScrollingOnSingleTap">
            <label for="continueScrollingOnSingleTap">
                <span class="label-title">Continue scrolling on single tap</span>
                <span class="note">Scroll faster while a scroll is already in progress.</span>
            </label>
        </section>

        <!-- <input type="checkbox" id="fastScrollingEnabled">
        <label for="fastScrollingEnabled">Enable fast scrolling (double tap + move finger up or down, disables one finger zoom)</label> -->

        <hr>
        <div id="footer-buttons">
            <button type="button" id="donateButton">
                <img alt="" src="./icons/donate.svg">
                Support this project
            </button>
            <button type="button" id="writeAReviewButton">
                <img alt="" src="./icons/review.svg">
                Write a review
            </button>
            <button type="button" id="githubButton">
                <img alt="" src="./icons/github.svg">
                View on GitHub
            </button>
        </div>
    </main>

    <script src="options.js"></script>
</body>
</html>
