<!DOCTYPE html>
<html>
<head>
    <title>Double Tap Scroll Options</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 16px;
        }
        label {
            margin-left: 8px;
        }
        #footer-buttons {
            margin-top: 16px;
        }
        button {
            display: flex;
            align-items: center;
            margin-right: 10px;
            padding: 5px 10px;
            font-size: 14px;
            cursor: pointer;
        }
        button img {
            margin-right: 5px;
        }
        hr{
            opacity: 0.2;
        }
    </style>
</head>
<body>
    <input type="number" id="scrollVelocityMultiplier" min="0.1" max="5" step="0.1" value="1">
    <label for="scrollVelocityMultiplier">Scroll speed on double tap (higher values = faster, default 1.0)</label>
    <br><br>

    <input type="checkbox" id="continueScrollingOnSingleTap">
    <label for="continueScrollingOnSingleTap">Scroll faster on single tap, while scrolling in progress</label>
    <br><br>

    <input type="checkbox" id="fastScrollingEnabled">
    <label for="fastScrollingEnabled">Enable fast scrolling (double tap + move finger up or down)</label>

    <hr>
    <div id='footer-buttons'>
        <button type='button' id='donateButton'> 
            <img height='15px' width='15px' src="./icons/donate.svg" /> Support this project</button>
        <!-- <button type='button' id='writeAReviewButton'> 
        <img height='15px' width='15px' src="./icons/review.svg" /> Write a Review</button>
        <button type='button' id='githubButton'>
            <img height='15px' width='15px' src="./icons/github.svg" /> View GitHub</button> -->
    </div>

    <script src="options.js"></script>
</body>
</html>
